<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具箱 · DEV // HUB</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icon.svg" />
  <link rel="stylesheet" href="../assets/theme.css" />
  <style>
    .tools-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .tool-title-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      color: #e0e7ff;
      background: rgba(99, 102, 241, 0.16);
      border: 1px solid rgba(99, 102, 241, 0.38);
    }

    .frame-card {
      padding: 0;
      height: calc(100vh - 220px);
      min-height: 600px;
      background: #0d0d10;
    }

    .tool-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #0d0d10;
    }

    body.wide-mode .container {
      max-width: 100%;
      padding: 18px 20px 24px;
    }

    body.wide-mode .frame-card {
      height: calc(100vh - 172px);
    }

    .frame-tip {
      position: absolute;
      bottom: 14px;
      right: 16px;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(24, 24, 27, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <img class="brand-icon" src="../assets/icon.svg" alt="DEV // HUB" />
        <a class="brand-title" href="../">DEV // HUB</a>
        <span class="brand-sub">开发者工具箱</span>
      </div>

      <nav class="nav-pills" aria-label="主导航">
        <a class="nav-pill" href="../">工作台</a>
        <a class="nav-pill active" href="./">工具箱</a>
        <a class="nav-pill" href="../digest/">早报</a>
        <a class="nav-pill" href="../vinyl/">一碟</a>
        <a class="nav-pill" href="../film/">一影</a>
        <a class="nav-pill" href="../nba/">NBA</a>
        <a class="nav-pill" href="../hana/">Hana</a>
      </nav>

      <div class="clock-box" title="上海时间 (Asia/Shanghai)">
        <span id="clockDate">----.--.--</span>
        <span class="clock-time" id="clockTime">--:--:--</span>
      </div>
    </header>

    <div class="tools-toolbar">
      <div class="tool-title-badge">
        <span style="color:#818cf8;">⌘</span>
        <span id="toolHeading">IT-Tools · 开发者日常瑞士军刀</span>
      </div>

      <div style="display:flex;align-items:center;gap:8px;">
        <button class="btn btn-sm" id="btnWideMode">⛶ 宽屏模式</button>
        <a class="btn btn-sm" id="btnExternal" href="#" target="_blank" rel="noopener noreferrer">新标签页打开 ↗</a>
      </div>
    </div>

    <main class="card frame-card">
      <iframe
        id="toolFrame"
        class="tool-frame"
        title="IT-Tools 工作区"
        allow="clipboard-read; clipboard-write"
      ></iframe>

      <div class="frame-tip" id="frameTip" style="display:none;">
        <span>如页面未加载，请点击右上角「新标签页打开」。</span>
        <button class="btn btn-sm" id="btnDismissTip" style="padding:2px 8px;">知道了</button>
      </div>
    </main>
  </div>

  <script type="module">
    import { SITE_CONFIG } from '../config.js';
    import { startClock } from '../assets/common.js';

    // 首次访问时为同源内置的 IT-Tools 默认启用深色模式，与主站视觉无缝衔接
    try {
      if (!localStorage.getItem('vueuse-color-scheme')) {
        localStorage.setItem('vueuse-color-scheme', 'dark');
      }
    } catch (_) {}

    startClock(
      document.getElementById('clockDate'),
      document.getElementById('clockTime')
    );

    function resolveToolUrl(rawUrl) {
      if (/^https?:\/\//i.test(rawUrl) || rawUrl.startsWith('/')) {
        return rawUrl;
      }
      return rawUrl.startsWith('./') ? `../${rawUrl.slice(2)}` : `../${rawUrl}`;
    }

    const itTools = SITE_CONFIG.tools.itTools;
    const toolUrl = resolveToolUrl(itTools.url);
    const frame = document.getElementById('toolFrame');
    const btnExternal = document.getElementById('btnExternal');
    const btnWideMode = document.getElementById('btnWideMode');
    const frameTip = document.getElementById('frameTip');

    document.getElementById('toolHeading').textContent = `${itTools.name} · ${itTools.tagline}`;
    document.title = `${itTools.name} · DEV // HUB`;
    frame.src = toolUrl;
    btnExternal.href = toolUrl;

    const isExternal = /^https?:\/\//i.test(toolUrl);
    if (isExternal && localStorage.getItem('workspace_tip_dismissed') !== '1') {
      frameTip.style.display = 'flex';
    }

    // 宽屏模式记忆
    if (localStorage.getItem('tools_wide_mode') === '1') {
      document.body.classList.add('wide-mode');
      btnWideMode.textContent = '⊡ 标准宽度';
    }

    btnWideMode.addEventListener('click', () => {
      const isWide = document.body.classList.toggle('wide-mode');
      localStorage.setItem('tools_wide_mode', isWide ? '1' : '0');
      btnWideMode.textContent = isWide ? '⊡ 标准宽度' : '⛶ 宽屏模式';
    });

    document.getElementById('btnDismissTip').addEventListener('click', () => {
      frameTip.style.display = 'none';
      localStorage.setItem('workspace_tip_dismissed', '1');
    });
  </script>
</body>
</html>
