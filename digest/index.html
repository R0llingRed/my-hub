<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>极客早报 · DEV // HUB</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icon.svg" />
  <link rel="stylesheet" href="../assets/theme.css" />
  <style>
    .digest-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-pill.active {
      background: rgba(99, 102, 241, 0.22);
      border-color: rgba(99, 102, 241, 0.55);
      color: #e0e7ff;
    }

    .muse-banner {
      display: none;
      margin-bottom: 14px;
      padding: 14px 18px;
      background:
        radial-gradient(circle at 100% 0%, rgba(244, 63, 94, 0.1), transparent 50%),
        var(--bg-elevated);
      border-color: rgba(244, 63, 94, 0.24);
    }

    .muse-banner.visible {
      display: block;
    }

    .muse-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: #fda4af;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.28);
    }

    .read-progress-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding: 12px 16px;
    }

    .read-bar-rail {
      flex: 1;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .read-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #6366f1, #10b981);
      transition: width 0.28s ease;
    }

    .digest-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .digest-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 15px 18px;
      border-radius: 14px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      transition: all 0.16s ease;
    }

    .digest-row:hover {
      border-color: var(--border-hover);
      background: var(--bg-elevated-hover);
      transform: translateY(-1px);
    }

    .digest-row.has-summary .digest-main {
      cursor: pointer;
    }

    .digest-row.is-read {
      opacity: 0.56;
    }

    .digest-main {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .digest-title {
      font-size: 14.5px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 4px;
      display: block;
    }

    .digest-title-btn {
      border: 0;
      padding: 0;
      background: transparent;
      text-align: left;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.48;
      color: var(--text);
      margin-bottom: 3px;
      display: block;
      width: 100%;
    }

    .digest-title-btn:hover {
      color: #c7d2fe;
    }

    .digest-orig-title {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 5px;
      overflow-wrap: anywhere;
    }

    .digest-tldr-preview {
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .digest-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .digest-row-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-mark-read {
      flex-shrink: 0;
      padding: 5px 10px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
    }

    .btn-mark-read.done {
      border-color: rgba(16, 185, 129, 0.45);
      background: rgba(16, 185, 129, 0.14);
      color: #6ee7b7;
    }

    /* Reading Drawer Content */
    .summary-tldr-box {
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.1);
      border-left: 3px solid #818cf8;
      font-size: 14.5px;
      line-height: 1.7;
      color: #f4f4f5;
      margin-bottom: 18px;
    }

    .summary-bullets {
      margin: 0 0 18px;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 14px;
      line-height: 1.7;
      color: #d4d4d8;
    }

    .muse-take-box {
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(244, 63, 94, 0.08);
      border: 1px solid rgba(244, 63, 94, 0.25);
      font-size: 13.5px;
      line-height: 1.7;
      color: #ffe4e6;
      margin-bottom: 22px;
    }

    .drawer-footer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      .read-progress-wrap {
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 14px;
      }

      .read-bar-rail {
        order: 3;
        flex-basis: 100%;
      }

      .digest-row {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        padding: 13px 14px;
      }

      .digest-row-actions {
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <img class="brand-icon" src="../assets/icon.svg" alt="DEV // HUB" />
        <a class="brand-title" href="../">DEV // HUB</a>
        <span class="brand-sub">极客早报 · 3 分钟信息降噪台</span>
      </div>

      <nav class="nav-pills" aria-label="主导航">
        <a class="nav-pill" href="../">工作台</a>
        <a class="nav-pill" href="../tools/">工具箱</a>
        <a class="nav-pill active" href="./">早报</a>
        <a class="nav-pill" href="../vinyl/">一碟</a>
        <a class="nav-pill" href="../film/">一影</a>
        <a class="nav-pill" href="../nba/">NBA</a>
        <a class="nav-pill" href="../hana/">Hana</a>
      </nav>

      <div class="clock-box" title="上海时间 (Asia/Shanghai)">
        <span id="clockDate">----.--.--</span>
        <span class="clock-time" id="clockTime">--:--:--</span>
      </div>
    </header>

    <div class="digest-toolbar">
      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:10px;">
        <div class="qotd-tabs" role="tablist" aria-label="阅读模式">
          <button class="qotd-tab active" id="modeCuratedBtn" data-digest-mode="curated">✦ Muse 定刊</button>
          <button class="qotd-tab" id="modeLiveBtn" data-digest-mode="live">⚡ 实时流</button>
        </div>

        <div class="filter-pills" id="filterPills" role="tablist" aria-label="数据源筛选">
          <button class="btn btn-sm filter-pill active" data-source="all">全部精选</button>
          <button class="btn btn-sm filter-pill" data-source="hn">Hacker News</button>
          <button class="btn btn-sm filter-pill" data-source="github">GitHub 热门</button>
          <button class="btn btn-sm filter-pill" data-source="v2ex">V2EX 热议</button>
          <button class="btn btn-sm filter-pill" data-source="devto">DEV.to</button>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-sm" id="btnResetRead">清空已读</button>
        <button class="btn btn-sm btn-primary" id="btnRefreshDigest">↻ 刷新早报</button>
      </div>
    </div>

    <!-- Muse 主编卷首语 -->
    <section class="card muse-banner" id="museEditorBanner" aria-label="Muse 卷首语">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px;">
        <span class="muse-chip" id="museEditionBadge">✦ Muse 定刊</span>
        <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);" id="museUpdatedAt">—</span>
      </div>
      <div style="font-size:13.5px;line-height:1.65;color:#e4e4e7;" id="museEditorNote"></div>
    </section>

    <section class="card read-progress-wrap" aria-label="今日阅读进度">
      <span style="font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);" id="digestDateLabel">预计阅读 3 分钟 · 信息降噪台</span>
      <div class="read-bar-rail">
        <div class="read-bar-fill" id="readBarFill"></div>
      </div>
      <span class="tag" id="readProgressBadge">已读 0 / 0</span>
    </section>

    <div id="digestNotice" style="display:none;font-size:12px;color:var(--text-muted);margin-bottom:12px;font-family:var(--font-mono);"></div>

    <main class="digest-list" id="digestList">
      <div class="card" style="text-align:center;padding:42px 20px;font-family:var(--font-mono);font-size:13px;color:var(--text-muted);">
        正在加载早报内容...
      </div>
    </main>

    <footer class="footer">
      <span>Muse 定刊源：data/digest.json · 实时兜底：HN / GitHub / V2EX / DEV.to</span>
      <a href="../">← 返回工作台</a>
    </footer>
  </div>

  <!-- 站内 Muse 摘要阅读抽屉 -->
  <div class="drawer-backdrop" id="digestDrawer" role="dialog" aria-modal="true" aria-label="Muse 摘要阅读">
    <div class="drawer-panel">
      <div class="drawer-header">
        <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;">
          <span class="source-badge" id="drawerSourceBadge">HN</span>
          <span id="drawerMetaText" style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">—</span>
        </div>
        <button class="btn btn-sm" id="btnCloseDigestDrawer">✕ 关闭</button>
      </div>
      <div class="drawer-body" id="digestDrawerBody"></div>
    </div>
  </div>

  <script type="module" src="../assets/digest.js"></script>
</body>
</html>
