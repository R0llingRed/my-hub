<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="glow" x1="12" y1="12" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
  </defs>

  <!-- Squircle dark base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- Subtle vinyl / orbit arc in background -->
  <circle cx="32" cy="32" r="21" stroke="url(#glow)" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="68 24"/>

  <!-- Terminal chevron '>' -->
  <path d="M18 22L29 32L18 42" stroke="url(#glow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cursor / bar '_' -->
  <path d="M33 42H46" stroke="#fafafa" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Accent live spark dot -->
  <circle cx="45" cy="22" r="3.5" fill="#34d399"/>
</svg>
